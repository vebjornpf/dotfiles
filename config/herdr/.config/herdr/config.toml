onboarding = false

[terminal]
new_cwd = "follow"

[theme]
name = "catppuccin"

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[keys]
# Keep Herdr's default Ctrl-b prefix so it can coexist with tmux's Ctrl-a.
workspace_picker = "prefix+w"
goto = "prefix+g"
open_notification_target = "prefix+shift+o"
previous_agent = "prefix+alt+p" # previous agent; shown in prefix help
next_agent = "prefix+alt+n" # next agent; shown in prefix help
rename_workspace = ""

[[keys.command]]
key = "prefix+o"
type = "popup"
command = "~/.config/herdr/bin/workspace-picker"
description = "fuzzy project workspace picker"
width = "80%"
height = "70%"

[[keys.command]]
key = "prefix+shift+w"
type = "popup"
command = "~/.config/herdr/bin/open-workspace-picker"
description = "focus or close an open workspace"
width = "70%"
height = "60%"

[ui]
agent_panel_sort = "spaces"
window_title = "{workspace}"
