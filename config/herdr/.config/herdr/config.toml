onboarding = false

[terminal]
new_cwd = "follow"

[theme]
name = "catppuccin"

# Frappé overrides: the built-in Catppuccin theme is Mocha.
# Explicit backgrounds avoid inheriting the outer terminal's palette.
[theme.custom]
panel_bg = "#303446"
sidebar_bg = "#292c3c"
active_row_bg = "#414559"
selection_bg = "#51576d"
surface0 = "#414559"
surface1 = "#51576d"
surface_dim = "#292c3c"
overlay0 = "#737994"
overlay1 = "#838ba7"
text = "#c6d0f5"
subtext0 = "#a5adce"
accent = "#8caaee"
mauve = "#ca9ee6"
green = "#a6d189"
yellow = "#e5c890"
red = "#e78284"
blue = "#8caaee"
teal = "#81c8be"
peach = "#ef9f76"

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[keys]
# Keep Herdr's default Ctrl-b prefix so it can coexist with tmux's Ctrl-a.
workspace_picker = "prefix+w"
goto = "prefix+g"
previous_workspace = "ctrl+alt+k"
next_workspace = "ctrl+alt+j"
previous_tab = "ctrl+alt+h"
next_tab = "ctrl+alt+l"
open_notification_target = "prefix+shift+o"
previous_agent = "ctrl+alt+up" # previous agent; shown in prefix help
next_agent = "ctrl+alt+down" # next agent; shown in prefix help
rename_workspace = ""

[[keys.command]]
key = "ctrl+shift+alt+s"
type = "popup"
command = "~/.config/herdr/bin/agent-status"
description = "show status for all agents"
width = "70%"
height = "70%"

[[keys.command]]
key = "prefix+o"
type = "popup"
command = "~/.config/herdr/bin/workspace-picker"
description = "fuzzy project workspace picker"
width = "80%"
height = "70%"

[[keys.command]]
key = "prefix+shift+w"
type = "popup"
command = "~/.config/herdr/bin/open-workspace-picker"
description = "focus or close an open workspace"
width = "70%"
height = "60%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "~/.config/herdr/bin/tab-picker"
description = "fuzzy-pick a tab in the current workspace"
width = "80%"
height = "60%"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "rmarganti.herdr-pluck.open-url"
description = "open visible URL"

[ui]
agent_panel_sort = "spaces"
window_title = "{workspace}"

[experimental]
kitty_graphics = true
