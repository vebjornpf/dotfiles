source-file ~/.config/tmux/tmux.reset.conf

set-option -g default-terminal 'tmux-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'
set -ga update-environment "LANG LC_ALL LC_CTYPE LC_COLLATE LC_MESSAGES LC_MONETARY LC_NUMERIC LC_TIME"
set-option -g mouse on
set-option -g display-time 4000
set-option -g display-panes-time 3000

set -g prefix C-a            # rebind the prefix to ctrl+a
set -g status-interval 2     # refresh state every 2 seconds
set -g base-index 1          # start indexing windows at 1 instead of 0
set -g detach-on-destroy off # don't exit from tmux when closing a session
set -g escape-time 0         # zero-out escape time delay
set -g history-limit 1000000 # increase history size (from 2,000)
set -g renumber-windows on   # renumber all windows when any window is closed
set -g repeat-time 600
set -g set-clipboard on      # use system clipboard
set -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set -g status-position top

# Plugins
set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'catppuccin/tmux'
set -g @plugin 'mike-rambil/tmux-catppuccin'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-urlview'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'jonmosco/kube-tmux'


# tmux-fzf configuration
TMUX_FZF_OPTIONS="-p -w 90% -h 90% -m"

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @override_copy_command 'clip.exe'
set -g @urlview-open-command '~/.config/tmux/scripts/open-url'
set -g @catppuccin_custom_plugin_dir "$HOME/.config/tmux/custom"

# Catppuccin
set -g @catppuccin_flavour 'macchiato' # latte,frappe, macchiato or mocha
set -g @catppuccin_status_left_separator '<'
set -g @catppuccin_status_right_separator '>'
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_modules_right "user jira date_time cpu battery"
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "yes"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text "%H:%M"

bind t popup -w50% -h50% -E "$SHELL"
bind b popup -w90% -h90% -E btm
bind o popup -w80% -h70% -E $HOME/.config/tmux/scripts/tmux-sessionizer
bind ^H previous-window
bind ^L next-window
bind p popup -w80% -h70% -E 'selected=$(tmux list-sessions -F "#{session_name},#{session_last_attached}" | sort -t, -k2,2nr | tail -n +2 | cut -d, -f1 | fzf --prompt="sessions > " --border=rounded --border-label=" sessions " --header="enter: switch | esc: cancel" --header-first --info=inline-right --no-scrollbar --cycle --color="bg:-1,bg+:#313244,fg:#cdd6f4,fg+:#f5e0dc,hl:#f38ba8,hl+:#f38ba8,prompt:#cba6f7,pointer:#f5c2e7,marker:#a6e3a1,spinner:#f9e2af,info:#89b4fa,border:#45475a,label:#cba6f7,header:#7f849c"); [ -n "$selected" ] && tmux switch-client -t "$selected"'
bind l if-shell -F '#{!=:#{client_last_session},}' 'switch-client -l' 'display-message "No last session"'
bind Q popup -w90% -h90% -E 'selected=$(tmux list-panes -s -F "#{window_index} #{pane_current_command} #{session_name}:#{window_index}.#{pane_index}" | awk "{print \$1 \" \" \$2 \"\t\" \$3}" | fzf --layout=reverse --border --delimiter="\t" --with-nth=1 --preview "target=\$(printf {} | cut -f2); tmux capture-pane -p -t \$target -S -200 | tail -n 40" --preview-window "right,70%,border-left"); [ -n "$selected" ] && target=$(printf "%s" "$selected" | cut -f2) && window_target=$(printf "%s" "$target" | cut -d "." -f 1) && tmux select-window -t "$window_target" && tmux select-pane -t "$target"'
bind n popup -w90% -h90% -E 'window=$(tmux display -p -F "#S:#I.#P") && export FZF_DEFAULT_OPTS="-m --layout=reverse --border" && navi --print | tr -d "\n" | tmux load-buffer -b tmp - && tmux paste-buffer -drp -t $window -b tmp'
bind r popup -w90% -h90% -E 'rg --color=always --line-number --no-heading --smart-case "${*:-}" | fzf --ansi --color --delimiter : --preview "bat --style=numbers --color=always {1} --highlight-line {2}" --bind "enter:become(vim {1} +{2})"'
bind-key -n C-t split-window -h -c "#{session_path}"
bind-key -n C-b split-window -v -c "#{session_path}"
bind-key -n C-n new-window -c "#{session_path}"
bind-key w kill-pane
bind-key q kill-session

bind R source-file ~/.config/tmux/tmux.conf \; display-message "✨ Config reloaded..."

# Run the plugins
run '~/.config/tmux/plugins/tpm/tpm'
